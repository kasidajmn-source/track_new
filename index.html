<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ติดตามโครงการ — เอกสารและความคืบหน้างานก่อสร้าง</title>
  <meta name="description" content="รวบรวมเอกสารแต่ละโครงการ ติดตามความคืบหน้าจาก BOQ รายสัปดาห์ และสรุปภาพรวมสำหรับนำเสนอ">
  <meta name="theme-color" content="#172238">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    // ตั้งธีมก่อนวาดหน้า เพื่อไม่ให้หน้ากะพริบ
    try {
      var c = JSON.parse(localStorage.getItem('pt.conf.v1') || '{}');
      var t = c.theme && c.theme !== 'auto' ? c.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main id="view" tabindex="-1"><div class="loading"><span class="spin"></span>กำลังเปิดระบบ…</div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก"></nav>
  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">ต้องเปิด JavaScript เพื่อใช้งานระบบนี้</p></noscript>
  <!-- กฎกลาง (สิทธิ์ ขั้นตอนอนุมัติ อีเมล) ใช้ร่วมกับ Apps Script ต้องโหลดก่อนแอป -->
  <script src="assets/js/rules.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
